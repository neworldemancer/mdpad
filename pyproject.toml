[project]
name = "mdpad"
version = "0.1.0"
description = "Context-aware scientific writing environment (PoC)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "neworldemancer", email = "neworldemancer@gmail.com" }
]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Topic :: Text Editors",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pystray>=0.19.5",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.51.0",
]

[project.urls]
Homepage = "https://github.com/neworldemancer/mdpad"
Repository = "https://github.com/neworldemancer/mdpad"
Issues = "https://github.com/neworldemancer/mdpad/issues"

[project.scripts]
mdpad = "mdpad:main"
mdpad-configure = "mdpad.configure:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.0",
    "mypy>=1.19.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
